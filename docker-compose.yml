version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: cofcof
      POSTGRES_PASSWORD: cofcof_pwd
      POSTGRES_DB: cofcof_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cofcof -d cofcof_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
